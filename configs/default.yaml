# GymPose-Lite Configuration

# ---------- Dataset ----------
dataset:
  coco_root: "~/GymPose-Lite/datasets/coco"       # train2017/, val2017/, annotations/
  gym_root: "~/GymPose-Lite/datasets/gym"          # Kaggle gym COCO-format
  input_size: [256, 192]       # H, W
  heatmap_size: [64, 48]       # H, W  (1/4 of input)
  num_keypoints: 17
  sigma: 3                     # Gaussian kernel sigma for heatmap generation

# ---------- Augmentation ----------
augmentation:
  flip: true
  rotation: 30                 # +/- degrees
  scale_min: 0.75
  scale_max: 1.25

# ---------- Skeleton (COCO 17-keypoint) ----------
skeleton:
  joint_names:
    - nose
    - left_eye
    - right_eye
    - left_ear
    - right_ear
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
  # Bone connections (pairs of joint indices)
  bones:
    - [0, 1]    # nose - left_eye
    - [0, 2]    # nose - right_eye
    - [1, 3]    # left_eye - left_ear
    - [2, 4]    # right_eye - right_ear
    - [5, 6]    # left_shoulder - right_shoulder
    - [5, 7]    # left_shoulder - left_elbow
    - [7, 9]    # left_elbow - left_wrist
    - [6, 8]    # right_shoulder - right_elbow
    - [8, 10]   # right_elbow - right_wrist
    - [5, 11]   # left_shoulder - left_hip
    - [6, 12]   # right_shoulder - right_hip
    - [11, 12]  # left_hip - right_hip
    - [11, 13]  # left_hip - left_knee
    - [13, 15]  # left_knee - left_ankle
    - [12, 14]  # right_hip - right_knee
    - [14, 16]  # right_knee - right_ankle
  # Flip pairs for horizontal augmentation
  flip_pairs:
    - [1, 2]    # left_eye <-> right_eye
    - [3, 4]    # left_ear <-> right_ear
    - [5, 6]    # left_shoulder <-> right_shoulder
    - [7, 8]    # left_elbow <-> right_elbow
    - [9, 10]   # left_wrist <-> right_wrist
    - [11, 12]  # left_hip <-> right_hip
    - [13, 14]  # left_knee <-> right_knee
    - [15, 16]  # left_ankle <-> right_ankle

# ---------- Model ----------
model:
  backbone: "mobilenet_v3_small"
  backbone_channels: 960
  deconv_channels: 256
  deconv_layers: 3
  deconv_kernel: 4
  use_gnn: true
  gnn_hidden: 64

# ---------- Training ----------
train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"
  heatmap_loss_weight: 1.0
  coord_loss_weight: 0.1
  bone_loss_weight: 0.01
  unfreeze_epoch: 10
  val_interval: 10
  save_dir: "~/GymPose-Lite/checkpoints"

# ---------- Fine-tuning ----------
finetune:
  epochs: 20
  lr: 0.0001
  checkpoint: ""               # Path to COCO pretrained checkpoint

# ---------- Demo ----------
demo:
  ema_alpha: 0.6               # Temporal smoothing factor
  confidence_threshold: 0.3    # Min keypoint confidence to draw
  exercise_angles:
    squat:
      knee_min: 80
      knee_max: 170
      back_min: 60
    pushup:
      elbow_min: 70
      elbow_max: 160
      hip_min: 160
    deadlift:
      back_min: 90
      hip_min: 80
